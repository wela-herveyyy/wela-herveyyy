<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-label="Giya extension UI demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="45%" stop-color="#f3e9f4"/>
      <stop offset="100%" stop-color="#dde9f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <clipPath id="panelClip"><rect x="0" y="0" width="300" height="340" rx="18"/></clipPath>
  </defs>
  <rect width="920" height="480" fill="url(#bg)"/>
  <rect x="48" y="36" width="220" height="408" rx="20" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.8"/>
  <circle cx="78" cy="68" r="12" fill="#111827"/>
  <text x="100" y="73" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111827">Giya</text>
  <text x="100" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7280">Chat history</text>
  <rect x="68" y="112" width="180" height="36" rx="18" fill="#ebe4f7"/>
  <text x="124" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">New chat</text>
  <rect x="68" y="160" width="86" height="28" rx="14" fill="#f3f4f6"/>
  <rect x="160" y="160" width="88" height="28" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="92" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#374151">Chats</text>
  <text x="182" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#111827">Canvas</text>
  <text x="420" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6b7280">CHAT / LIVRO SYSTEMS INC.</text>
  <text x="420" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="700" fill="#111827">Hi, Hervey.</text>
  <text x="420" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#6b7280">Ask about tasks, bugs, or school setup.</text>
  <rect x="420" y="250" width="380" height="52" rx="26" fill="#ffffff" fill-opacity="0.85" stroke="#e5e7eb"/>
  <text x="448" y="281" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#9ca3af">e.g. What tasks are overdue?</text>
  <g filter="url(#soft)">
    <rect x="300" y="150" width="52" height="188" rx="26" fill="#ffffff" fill-opacity="0.8" stroke="#ffffff"/>
    <circle cx="326" cy="182" r="16" fill="#111827"/>
    <path d="M332 182l-7-6M332 182l-7 6" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="326" cy="222" r="14" fill="transparent" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="319" y="216" width="14" height="10" rx="2" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="326" cy="262" r="14" fill="transparent" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="326" cy="258" r="4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M318 272c2-5 14-5 16 0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="326" cy="302" r="14" fill="transparent" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M326 296v10M322 300h8" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="370,120;370,90;370,90;370,120" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
      <rect width="300" height="340" rx="18" fill="#ffffff" fill-opacity="0.88" stroke="#ffffff"/>
      <g clip-path="url(#panelClip)">
        <text x="18" y="28" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">Concerns</text>
        <text x="270" y="28" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#9ca3af">x</text>
        <text x="18" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7280">Pick a concern, then pin a UI element.</text>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.85;1" dur="5s" repeatCount="indefinite"/>
          <rect x="14" y="68" width="272" height="72" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
          <text x="28" y="90" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369a1">SPB-03976</text>
          <text x="28" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827">Auto RAG + Terms of Use login gate</text>
          <text x="28" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b7280">Feature Request | Sprint_12_R&amp;D</text>
          <rect x="14" y="150" width="272" height="72" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
          <text x="28" y="172" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369a1">SPB-03949</text>
          <text x="28" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827">Connect file uploader to Silid</text>
          <text x="28" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b7280">Bugs/Issues | Open</text>
          <rect x="14" y="232" width="272" height="72" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
          <text x="28" y="254" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369a1">SPB-03546</text>
          <text x="28" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827">Enrichment content toggle</text>
          <text x="28" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b7280">Feature Request | Overdue</text>
        </g>
      </g>
    </g>
  </g>
  <g>
    <circle cx="780" cy="360" r="18" fill="#38bdf8" fill-opacity="0.25">
      <animate attributeName="r" values="16;26;16" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="360" r="16" fill="#111827"/>
    <text x="780" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">H</text>
  </g>
  <text x="48" y="462" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7280">Giya | in-page Concerns dock | pin comments on any UI</text>
</svg>
